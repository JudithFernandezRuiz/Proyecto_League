version: 2

models:

  - name: stg_jugador
    description: "Jugadores únicos con su elo y rango"
    columns:
      - name: id_jugador
        tests:
          - unique
          - not_null
      - name: nombre_invocador
        tests:
          - not_null
      - name: elo
        tests:
          - not_null
      - name: lp
        tests:
          - not_null
      
  - name: stg_partida
    description: "Partidas únicas con sus metadatos"
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: patch
        tests:
          - not_null
      - name: modo_juego
        tests:
          - not_null

  - name: stg_campeon
    description: "Catálogo de campeones únicos"
    columns:
      - name: id_tipo_campeon
        tests:
          - unique
          - not_null
      - name: nombre
        tests:
          - not_null
      - name: id_clase
        tests:
          - not_null
      - name: id_rol
        tests:
          - not_null
    
  - name: stg_tipo_evento
    description: "Catálogo de tipos de eventos"
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: nombre
        tests:
          - not_null

  - name: stg_clase_campeon
    description: "Clases únicas de campeones"
    columns:
      - name: id_clase
        tests:
          - unique
          - not_null
      - name: clase
        tests:
          - not_null

  - name: stg_tipo_rol
    description: "Roles únicos de campeones"
    columns:
      - name: id_rol
        tests:
          - unique
          - not_null
      - name: rol_principal
        tests:
          - not_null

  - name: stg_posicion_jugador
    description: "Posiciones en el mapa"
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: nombre
        tests:
          - not_null

  - name: stg_ping
    description: "Tipos de pings"
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: stg_pick_o_ban
    description: "Picks y bans de cada partida"
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: id_partida
        tests:
          - not_null
      - name: id_campeon
        tests:
          - not_null
      - name: tipo_accion
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PICK', 'BAN']

  - name: stg_objeto
    description: "Catálogo de objetos"
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: stg_jugador_partida
    description: "Relación jugador partida"
    columns:
      - name: id_jugador_partida
        tests:
          - unique
          - not_null
      - name: id_partida
        tests:
          - not_null
      - name: id_jugador
        tests:
          - not_null
      - name: lado
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['Azul', 'Rojo']
      
      - name: id_posicion_jugador
        tests:
          - not_null

  - name: stg_evento_partida
    description: "Eventos del timeline de cada partida"
    columns:
      - name: id_evento
        tests:
          - unique
          - not_null
      - name: id_jugador
        tests:
          - not_null
      - name: id_partida
        tests:
          - not_null
      - name: tiempo_partida
        tests:
          - not_null
      - name: id_tipo_evento
        tests:
          - not_null