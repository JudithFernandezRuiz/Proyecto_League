version: 2

sources:
  - name: bronze
    database: "BRONZE_{{ env_var('DBT_ENVIRONMENTS', 'DEV') }}"
    schema: LEAGUE
    tables:
      - name: RAW_CHALLENGER_JUGADORES
        description: "Raw data from challenger_jugadores.csv - ~120 columns with player match data"
        columns:
          - name: match_id
            description: "Unique match identifier from Riot API"
          - name: puuid
            description: "Player UUID - unique player identifier"
          - name: summonerName
            description: "Player summoner name"
          - name: championId
            description: "Champion ID used in match"
          - name: wins
            description: "Win result (true/false)"
      
      - name: raw_picks_bans
        description: "Raw data from challenger_picks_bans.csv - picks and bans per match"
        columns:
          - name: match_id
            description: "Match identifier"
          - name: tipo
            description: "Action type (PICK or BAN)"
          - name: championId
            description: "Champion ID"
          - name: equipo
            description: "Team (100=BLUE, 200=RED)"
      
      - name: raw_eventos
        description: "Raw data from challenger_eventos.csv - timeline events per match"
        columns:
          - name: match_id
            description: "Match identifier"
          - name: tipo_evento
            description: "Event type (KILL, WARD_PLACED, etc)"
          - name: timestamp_ms
            description: "Event timestamp in milliseconds"
          - name: participantId
            description: "Player participant ID"
      
      - name: CAMPEON_DRAGON
        description: "Champion reference data from Data Dragon - class and main role"
        columns:
          - name: id
            description: "Champion ID"
            tests:
              - unique
              - not_null
          - name: nombre
            description: "Champion name"
            tests:
              - not_null
          - name: clase
            description: "Champion class/type (e.g., Marksman, Mage, Tank)"
          - name: rol_principal
            description: "Main role/position where champion is typically played"
      
      - name: OBJETO_ITEMS
        description: "In-game items reference data with cost information"
        columns:
          - name: id
            description: "Item ID"
            tests:
              - unique
              - not_null
          - name: nombre
            description: "Item name"
            tests:
              - not_null
          - name: costo
            description: "Item gold cost"
            tests:
              - not_null
