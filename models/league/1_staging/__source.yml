            data_type: varchar

      - name: tipo_campeon
        description: "Clasificación de campeones por estilo de juego y rol."
        columns:
          - name: id
            data_type: number
          - name: clase
            data_type: varchar
          - name: rol_principal
            data_type: varchar

      - name: tipo_evento
        description: "Catálogo de tipos de acciones registradas en el timeline (muertes, wards, etc.)."
        columns:
