version: 2

sources:
  - name: BRONZE
    database: "BRONZE_{{ env_var('DBT_ENVIRONMENTS', 'DEV') }}"
    schema: LEAGUE
    tables:
      - name: campeon
        description: "Diccionario de campeones (ID, Nombre, Rol)"
        columns:
          - name: id
            data_type: number
          - name: id_tipo_campeon
            data_type: number
          - name: nombre
            data_type: varchar

      - name: equipo
        description: "Información de bando (Azul 100, Rojo 200)"
        columns:
          - name: id
            data_type: number
          - name: nombre
            data_type: varchar

      - name: evento_partida
        description: "Sucesos temporales (muertes, objetivos, destrucciones)"
        columns:
          - name: id
            data_type: number
          - name: id_jugador
            data_type: number
          - name: id_partida
            data_type: varchar
          - name: tiempo_partida
            data_type: timestamp_ntz
          - name: id_tipo_evento
            data_type: number

      - name: jugador
        description: "Perfil de los invocadores (Nombre, PUUID, Rango)"
        columns:
          - name: id
            data_type: number
          - name: id_equipo
            data_type: number
          - name: nombre_invocador
            data_type: varchar
          - name: puuid
            data_type: varchar
          - name: elo
            data_type: varchar
          - name: tier
            data_type: varchar
          - name: lp
            data_type: number

      - name: jugador_partida
        description: "Relación de qué jugador estuvo en qué partida y en qué bando"
        columns:
          - name: id
            data_type: number
          - name: id_jugador
            data_type: number
          - name: id_partida
            data_type: varchar
          - name: lado
            data_type: varchar
          - name: id_posicion_jugador
            data_type: number

      - name: objeto
        description: "Catálogo de items del juego"
        columns:
          - name: id
            data_type: number
          - name: nombre
            data_type: varchar

      - name: partida
        description: "Tabla principal con metadatos de cada encuentro único."
        columns:
          - name: id
            data_type: varchar
          - name: fecha_inicio
            data_type: timestamp_ntz
          - name: fecha_fin
            data_type: timestamp_ntz
          - name: patch
            data_type: varchar
          - name: modo_juego
            data_type: varchar
          - name: resultado
            data_type: varchar

      - name: pick_o_ban
        description: "Detalle de la fase de draft (selección y bloqueo) de campeones."
        columns:
          - name: id
            data_type: number
          - name: id_partida
            data_type: varchar
          - name: id_jugador
            data_type: number
          - name: id_campeon
            data_type: number
          - name: tipo_accion
            data_type: varchar
          - name: orden_secuencia
            data_type: number
          - name: lado
            data_type: varchar

      - name: ping
        description: "Diccionario de tipos de señales (pings) utilizadas por los jugadores."
        columns:
          - name: id
            data_type: number
          - name: id_tipo_ping
            data_type: number
          - name: tipo
            data_type: varchar

      - name: posicion_jugador
        description: "Mapeo de posiciones en el mapa (TOP, JUNGLE, MID, etc.)."
        columns:
          - name: id
            data_type: number
          - name: nombre
            data_type: varchar

      - name: stg_challenger_jugadores
        description: "Carga preliminar de datos de jugadores específicos para validación."
        columns:
          - name: match_id
            data_type: varchar
          - name: puuid
            data_type: varchar
          - name: summonername
            data_type: varchar
          - name: championid
            data_type: number
          - name: championname
            data_type: varchar
          - name: win
            data_type: boolean
          - name: kills
            data_type: number
          - name: deaths
            data_type: number
          - name: assists
            data_type: number
          - name: teamid
            data_type: number
          - name: individualposition
            data_type: varchar
          - name: goldearned
            data_type: number
          - name: patch
            data_type: varchar

      - name: stg_challenger_raw
        description: "Extracción masiva de estadísticas finales de partidas de nivel Challenger."
        columns:
          - name: match_id
            data_type: varchar
          - name: puuid
            data_type: varchar
          - name: summonername
