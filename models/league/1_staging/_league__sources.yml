version: 2

sources:
  - name: riot_raw
    database: LEAGUE_DB
    schema: BRONZE
    description: "Capa Bronze del proyecto League of Legends con datos de Challenger"
    tables:
      # --- Tablas Maestras (Catálogos) ---
      - name: EQUIPO
        description: "Maestro de bandos (100: Blue, 200: Red)"
      - name: POSICION_JUGADOR
        description: "Maestro de posiciones (TOP, JUNGLE, etc.)"
      - name: CAMPEON
        description: "Catálogo de campeones extraídos de las partidas"
        columns:
          - name: id
            tests: [unique, not_null]
      - name: OBJETO
        description: "Catálogo de items detectados en los inventarios"
      - name: PING
        description: "Diccionario de tipos de alertas"
      - name: TIPO_EVENTO
        description: "Diccionario de tipos de eventos de timeline"
      - name: TIPO_CAMPEON
        description: "Clasificación de campeones (Tank, Mage, etc.)"

      # --- Tablas de Hechos (Movimientos) ---
      - name: JUGADOR
        description: "Maestro de invocadores únicos detectados"
        columns:
          - name: puuid
            tests: [unique, not_null]

      - name: PARTIDA
        description: "Registro único de encuentros"
        columns:
          - name: id
            tests: [unique, not_null]

      - name: JUGADOR_PARTIDA
        description: "Relación de muchos a muchos entre jugadores y partidas"
        columns:
          - name: id_partida
            tests:
              - relationships:
                  to: source('riot_raw', 'PARTIDA')
                  field: id

      - name: PICK_O_BAN
        description: "Fases de selección y bloqueo de campeones"

      - name: EVENTO_PARTIDA
        description: "Línea de tiempo detallada de eventos por partida"

      # --- Tablas de Staging (Crudo) ---
      - name: STG_CHALLENGER_RAW
        description: "Datos brutos de jugadores y estadísticas finales"
      - name: STG_PICKS_BANS_RAW
        description: "Datos brutos de la fase de picks/bans"
      - name: STG_EVENTOS_RAW
        description: "Datos brutos de eventos de línea de tiempo"